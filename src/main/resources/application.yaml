server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: job-application-tracker
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/job_application_tracker
    username: job_application_tracker
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
